name: Build Tauri Windows App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python Sidecar
        run: |
          pip install pyinstaller fastapi uvicorn pydantic
          pyinstaller --onefile omni_server/main.py
          mkdir src-tauri/binaries
          # Tauri sidecar naming convention requires the target triple on Windows:
          copy dist\main.exe src-tauri\binaries\omni_server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Automatically uses the version from tauri.conf.json
          releaseName: "ClickyAI Windows v__VERSION__"
          releaseBody: "Automated Windows Build via GitHub Actions"
          releaseDraft: true
          prerelease: false
