name: Desktop validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r omni_server/requirements.txt -r voice/requirements.txt
      - run: choco install tesseract --no-progress -y
      - shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Tesseract-OCR'
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ClickyAI-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libxdo-dev libxtst-dev libxcb1-dev libxrandr-dev libdbus-1-dev libayatana-appindicator3-dev libportaudio2 espeak-ng tesseract-ocr python3-pil python3-pytesseract
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ClickyAI-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
