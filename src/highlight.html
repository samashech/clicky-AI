<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .target {
      width: 40px;
      height: 40px;
      border: 4px solid #ff416c;
      border-radius: 50%;
      box-shadow: 0 0 20px #ff416c, inset 0 0 10px #ff4b2b;
      animation: pulse-target 1s infinite ease-in-out;
    }
    @keyframes pulse-target {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="target"></div>
</body>
</html>
